[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "selectime"
version = "0.1.0"
description = "Validation-selected foundation-model inputs on the TIME benchmark"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "matplotlib>=3.9,<4",
    "chronos-forecasting==2.3.1",
    "datasets>=2.17.1,<4",
    "gluonts==0.16.2",
    "numpy>=2.1.3,<2.2",
    "pandas>=2.2.3,<3",
    "pyarrow",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "torch>=2.5.1,<2.10",
    "tsicl==0.2.1",
    "hydra-core>=1.3,<1.4",
]

[project.urls]
Repository = "https://github.com/3gaspo/selectime"

[tool.hatch.build.targets.wheel]
packages = ["src/timebench"]

[tool.hatch.build.targets.wheel.force-include]
"src/timebench/config" = "timebench/config"
"src/timebench/conf" = "timebench/conf"
