stage: pipeline
prediction_group: all
experiment_mode: full
model: chronos2
datasets: [all]
terms: [short, medium, long]
excluded_datasets: [Coastal_T_S/5T, current_velocity/20T, azure2019_D/5T, azure2019_I/5T]
dataset_config: null
vanilla_predictions_path: null  # Evaluating TSFMs outputs/foundation_models/inference
seed: 0
device: cuda
context_length: null  # backbone maximum: Chronos-2 8192; Bolt 2048; TS-ICL 4096
batch_size: 32
k_values: [1, 5, 10, 15, 20]
datastore_scope: all
max_datastore_windows: null
# Only validation_length=0 disables selection.
datastore_stride: null
retrieval_context_length: null
# null requests at most the official number of test dates, immediately before test.
validation_length: null
minimum_overlap_fraction: 0.8
query_block_size: 256
datastore_block_size: 4096
bootstrap_replications: 1000
bootstrap_block_length: null
scope_ridge_alpha: 1.0
# Producer dependencies remain exact; these controls apply only to reports.
report_current_config: true
report_config_filters: {}
report_config_policy: error
report_repeat_policy: selected
hydra:
  run:
    dir: ${oc.env:TIME_LOGS,logs}/hydra/${now:%Y%m%d_%H%M%S}_${stage}
  job:
    chdir: false
